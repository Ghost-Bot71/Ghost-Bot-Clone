name: Ghost Bot — Start Bot

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *' # Proti 20 minute por por automatic restart

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Ekhane amra bot-er folder path nirdistho kore dichhi
    defaults:
      run:
        working-directory: ./ghost-bot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev \
            build-essential python3 pkg-config

      - name: Install Node dependencies
        run: npm install --no-audit --prefer-offline

      - name: Write FBSTATE from secret
        working-directory: ./ghost-bot
        run: |
          if [ -n "${{ secrets.FBSTATE }}" ]; then
            echo '${{ secrets.FBSTATE }}' > account.txt
            echo "✅ FBSTATE loaded into ghost-bot folder"
          else
            echo "❌ Error: Add FBSTATE in GitHub Secrets"
            exit 1
          fi

      - name: Start Ghost Bot
        env:
          PORT: 3001
          NODE_ENV: production
        run: |
          # Loop jate crash korle abar start hoy
          until node index.js; do
            echo "Bot crashed. Restarting..."
            sleep 5
          done
          
